<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiry Panel Login | AsadovBank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin-dark.css}" href="../static/css/admin-dark.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      color: #f8fafc;
    }
    .auth-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(129, 140, 248, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(99, 102, 241, 0.2);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .shield-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3));
      border: 1px solid rgba(168, 85, 247, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a855f7;
    }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    .auth-subtitle {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .auth-input-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .auth-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }
    .auth-input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(30, 41, 59, 0.8);
      border: 1.5px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    .auth-input:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .auth-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .auth-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.4);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.84rem;
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #94a3b8;
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="shield-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>

    <h1 class="auth-title">Central Inquiry Panel</h1>
    <p class="auth-subtitle">Enter the special administrator password to manage customer inquiries, complaints and loan applications.</p>

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}">
      An error occurred
    </div>

    <form th:action="@{/admin/inquiry/login}" method="POST" autocomplete="off">
      <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />

      <div class="auth-input-group">
        <label for="inquiryPassword" class="auth-label">Inquiry Panel Password</label>
        <div style="position: relative;">
          <input type="password" id="inquiryPassword" name="inquiryPassword" class="auth-input"
                 placeholder="Enter the department password" style="padding-right: 42px;" required autofocus />
          <button type="button" onclick="toggleInquiryPwd()" title="Şifrəni göstər / gizlət"
                  style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; padding: 4px; display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Enter Inquiry Panel</span>
      </button>
    </form>

    <a th:href="${isAdminUser ? '/admin' : '/employee/portal'}" class="back-link"
       th:text="${isAdminUser ? '← Əsas Admin Panelinə Qayıt' : '← İşçi Portalına Qayıt'}">&larr; Geri Qayıt</a>
  </div>
  <script>
    function toggleInquiryPwd() {
      const inp = document.getElementById('inquiryPassword');
      if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
    }
  </script>
  <script th:src="@{/js/no-autocomplete-stay.js}" src="/js/no-autocomplete-stay.js"></script>
</body>
</html>
